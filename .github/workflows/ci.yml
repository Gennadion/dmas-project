name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  blockchain:
    name: blockchain (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test

  agents:
    name: agents (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The on-chain agent tests start their own Hardhat node and read the
      # compiled contract artifacts, so they need the blockchain/ project too.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci && npm run compile
        working-directory: blockchain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: agents
      - run: pytest -rs
        working-directory: agents
